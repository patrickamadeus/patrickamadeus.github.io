summary: >-
  My research goal is to build **robust, self-improving multimodal agents** that perceive, reason, and act
  reliably across diverse environments. I develop **evaluation** and **post-training** methods for **vision-language and
  video models**, with a current focus on **interactive environments**. My prior work spans **VLM post-training** and
  **knowledge distillation**, multimodal reasoning and robustness, and multilingual and multicultural benchmarks.
interests:
  - multimodal reasoning and evaluation
  - multimodal post-training
  - interactive environments and world models
  - embodied AI

